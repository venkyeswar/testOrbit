name: testorbit

services:
  server:
    build: ./server
    env_file:
      # Put SECRET_KEY here (see server/.env.example). Optional so `compose build` works without it,
      # but the server needs SECRET_KEY set to start in a container.
      - path: ./server/.env
        required: false
    environment:
      # Overrides any .env value: the database lives on the named volume.
      DATABASE_URL: sqlite:////data/testorbit.db
    volumes:
      - testorbit-data:/data
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  sample_api:
    build: ./sample_api
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  testorbit-data:
